name: Build and deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Protect the original site's search visibility
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || 'false' }}
        run: |
          if [ "$PUBLIC_INDEXABLE" = "true" ] && [ "${PAGES_URL%/}" != "https://klavierlernen-berlin.de" ]; then
            echo "Indexing is only allowed after Pages is configured for klavierlernen-berlin.de. Keep PUBLIC_INDEXABLE=false for the preview."
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - name: Build and verify preserved SEO
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || 'false' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
